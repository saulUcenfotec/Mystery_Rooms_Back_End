# Database Configuration
# Cambia estos valores según tu base de datos

# PostgreSQL (activo)
spring.datasource.url=jdbc:postgresql://localhost:5433/mystery_rooms
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Application Port
server.port=8080

# JWT Configuration
security.jwt.secret-key=mySecretKey123456789012345678901234567890123456789012345678901234567890
security.jwt.expiration-time=86400000
pixlr.api.key=local-dev-key

# Mail (dev placeholders)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=local
spring.mail.password=local
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Media storage
media.location=media

